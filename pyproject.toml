[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nba_pred"
version = "0.1.0"
description = "NBA home-team win prediction with a single shared feature pipeline"
requires-python = ">=3.10"
dependencies = [
    "pandas==2.3.3",
    "numpy==2.2.6",
    "nba_api==1.11.3",
    "xgboost==3.1.2",
    "scikit-learn==1.7.2",
    "joblib==1.5.3",
    "plotly==6.5.0",
    "pyarrow>=17",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nba-fetch = "nba_pred.data.fetch:_cli"
nba-train = "nba_pred.pipelines.train:main"
nba-backtest = "nba_pred.pipelines.backtest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
